---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: finsight-ai
data:
  OLLAMA_BASE_URL: "http://ollama-service:11434"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  LOG_LEVEL: "INFO"
  WORKERS: "4"
  CHROMA_PERSIST_DIR: "/app/data/chromadb"
  UPLOAD_DIR: "/app/data/uploads"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: finsight-ai
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_API_URL: "http://backend-service:8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: finsight-secrets
  namespace: finsight-ai
type: Opaque
stringData:
  REDIS_PASSWORD: "changeme-redis-password"
  # Add other secrets as needed
  # DB_PASSWORD: "changeme-db-password"
  # API_KEY: "changeme-api-key"
